name: SearchRadar

on:
  schedule:
    - cron: "17 * * * *"   # hourly at minute 17 (UTC); full hours are often delayed on GitHub
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send Telegram test message only"
        type: boolean
        default: false
      telegram_ids:
        description: "Setup: only show Telegram chat/topic ids (see job log)"
        type: boolean
        default: false
  push:
    paths: ["searches/**", "settings.json", "searchradar/**", "tests/**"]

permissions:
  contents: write           # commit state/*.json and RESULTS.md

concurrency:
  group: searchradar
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Validate config and run tests
        run: |
          python -m searchradar --validate
          python -m pytest -q

      - name: Show Telegram ids
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_ids }}
        run: python -m searchradar --telegram-ids
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Telegram test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram && !inputs.telegram_ids }}
        run: python -m searchradar --test-telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Search
        if: ${{ github.event_name != 'push' && !inputs.test_telegram && !inputs.telegram_ids }}
        run: python -m searchradar --verbose
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Build overview (site/ + RESULTS.md)
        if: ${{ !inputs.test_telegram && !inputs.telegram_ids }}
        run: python -m searchradar.site

      - name: Save state and RESULTS.md
        if: ${{ github.event_name != 'push' && !inputs.test_telegram && !inputs.telegram_ids }}
        run: |
          git config user.name "searchradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json state/matches.json RESULTS.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "state: update listings and results"
            git pull --rebase --autostash || true
            git push
          fi
