name: SearchRadar Pages

# Optional web overview. Only does something when the repository variable
# PAGES_ENABLED is "true" and Pages is enabled (Settings -> Pages -> Source: GitHub Actions).
# Kept separate so the hourly search never depends on Pages/environments.

on:
  workflow_run:
    workflows: ["SearchRadar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: searchradar-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m searchradar.site --md ""
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
