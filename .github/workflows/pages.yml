name: SearchRadar Pages

# Web overview. Deploys only once Pages is enabled (Settings -> Pages -> Source: GitHub Actions);
# until then the check job finds Pages disabled and build/deploy are skipped (no errors).
# Kept separate so the hourly search never depends on Pages/environments.

on:
  workflow_run:
    workflows: ["SearchRadar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: searchradar-pages
  cancel-in-progress: true

jobs:
  check:
    if: ${{ vars.PAGES_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled (Settings -> Pages -> Source: GitHub Actions) - nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m searchradar.site --md ""
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
