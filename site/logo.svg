<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="SearchRadar logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E3A5C"/>
      <stop offset="100%" stop-color="#071C30"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><circle cx="128" cy="128" r="112"/></clipPath>
  </defs>

  <!-- radar screen -->
  <circle cx="128" cy="128" r="120" fill="#0B2A44"/>
  <circle cx="128" cy="128" r="112" fill="url(#bg)" stroke="#38BDF8" stroke-width="3"/>
  <g fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5">
    <circle cx="128" cy="128" r="84"/>
    <circle cx="128" cy="128" r="56"/>
    <line x1="16" y1="128" x2="240" y2="128"/>
    <line x1="128" y1="16" x2="128" y2="240"/>
  </g>

  <!-- sweep -->
  <g clip-path="url(#screen)">
    <path d="M128 128 L128 16 A112 112 0 0 1 220 64 Z" fill="url(#sweep)"/>
    <line x1="128" y1="128" x2="128" y2="16" stroke="#5EEAD4" stroke-width="2.5" stroke-opacity="0.9"/>
  </g>

  <!-- hits -->
  <g filter="url(#glow)">
    <circle cx="176" cy="62" r="7" fill="#2DD4BF"/>
    <circle cx="68" cy="88" r="5" fill="#38BDF8"/>
    <circle cx="190" cy="168" r="4.5" fill="#38BDF8" fill-opacity="0.8"/>
    <circle cx="82" cy="186" r="3.5" fill="#2DD4BF" fill-opacity="0.7"/>
  </g>

  <!-- magnifier -->
  <g>
    <circle cx="122" cy="122" r="30" fill="#071C30" fill-opacity="0.65" stroke="url(#lens)" stroke-width="9"/>
    <path d="M106 112 A18 18 0 0 1 120 100" fill="none" stroke="#E0F2FE" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="144" y1="144" x2="170" y2="170" stroke="url(#lens)" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
